name: Deploy production
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA from main to deploy
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  select:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact commit belongs to main
        id: commit
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'A full lowercase commit SHA is required'; exit 1; }
          git cat-file -e "$REQUESTED_SHA^{commit}"
          git merge-base --is-ancestor "$REQUESTED_SHA" origin/main
          echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
          echo "Selected production commit: $REQUESTED_SHA" >> "$GITHUB_STEP_SUMMARY"
  validate:
    needs: select
    uses: ./.github/workflows/ci.yml
    with:
      commit_sha: ${{ needs.select.outputs.sha }}
  deploy:
    needs: [select, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:deploy -- production
      - name: Deploy consumer then web and record versions
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_COMMIT_SHA: ${{ needs.select.outputs.sha }}
        run: node scripts/publish-workers.mjs production
